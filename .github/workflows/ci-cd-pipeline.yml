name: OpenC2Hunter CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  lint-and-sast:
    name: SAST, Lint & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Security & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit -r backend/requirements.txt
      - name: Run Ruff Linter
        run: ruff check backend/ launch.py
      - name: Run Bandit SAST Scanner
        run: bandit -r backend/ -ll -ii

  unit-tests:
    name: Cross-Platform Pytest (${{ matrix.os }})
    needs: lint-and-sast
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Backend & Test Dependencies
        run: pip install -r backend/requirements.txt
      - name: Execute Unit & Security Guardrail Suite
        run: pytest backend/tests/ -v

  frontend-build:
    name: Frontend Build & Bundle Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & Build React UI
        working-directory: ./frontend
        run: |
          npm install
          npm run build
